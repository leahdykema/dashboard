<!DOCTYPE html>
<html lang="en_US">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Leah Dykema">
        <meta name="description" content="Leah Dykema's Time Keeper for Consultations">
        <meta name="theme-color" content="#000" id="theme-color-meta">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="TimeTracker">
        <meta property="og:image" name="image" content="https://leahdykema.us/img/leah-apple-jordan-creek.jpg">
        <meta property="og:title" content="Dashboard">
        <meta property="og:description" content="Leah Dykema's Time Keeper for Consultations">
        <link rel="shortcut icon" type="image/x-icon" href="https://leahdykema.us/img/leah-apple-jordan-creek.jpg">
        <link rel="apple-touch-icon" type="image/x-icon" href="https://leahdykema.us/img/leah-apple-jordan-creek.jpg">
        <link rel="manifest" href="manifest.json">
        <title>Time Tracker</title>
        <style>
            .hidden {
                display: none !important;
            }
        </style>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    </head>
    <body>
        <form id="login-view">
            <h1>Sign In or Create an Account</h1>
            <p id="auth-info" style="color: #0a0; text-align: center;"></p>
            <p id="auth-error" style="color: #f00; text-align: center;"></p>
            <input type="email" id="email" placeholder="Email" rrequired>
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" id="forgot-btn">Forgot Password</button>
            <div class="auth-actions">
                <button type="submit" id="login-btn">Log In</button>
                <button type="button" id="sign-up-btn">Sign Up</button>
            </div>
            <p style="text-align: center; opacity: 70%;"><a href="privacy.html">Privacy Policy</a> Version 2&#46;0&#46;1</p>
        </form>
        <div id="dashboard-view" style="display: none;">
            <header>
                <h1>Time Tracker</h1>
            </header>
            <main>
                <!-- Timer Form -->
                <section id="timer-view">
                    <h2>Log Time</h2>
                    <input type="text" id="client" placeholder="Client Name">
                    <input type="text" id="task" placeholder="Task">
                    <button id="start-btn">Start Timer</button>
                    <button id="stop-btn">Stop &amp; Save</button>
                    <button id="logs-btn">View Logs</button>
                    <button id="account-btn">Manage Account</button>
                </section>
                <!-- Client Logs -->
                <section id="logs-view" class="hidden">
                    <h2>Clients</h2>
                    <!-- Sidebar: Selectors -->
                    <aside>
                        <label for="client-select"><strong>Select Client:</strong></label>
                        <select id="client-select">
                            <option value="">-- Choose a Client --</option>
                        </select>
                        <label for="task-select"><strong>Select Task:</strong></label>
                        <select id="task-select">
                            <option value="">-- Choose a Task --</option>
                        </select>
                    </aside>
                    <div id="logs-display-container" style="margin: auto; align-content: center; text-align: center;"></div>
                    <!-- Export -->
                    <div id="config-pdf" class="hidden">
                        <h3 style="display: block;">Export Logs</h3>
                        <div id="export">
                            <label for="start-date">Start Date:</label>
                            <input type="date" id="start-date" required>
                            <label for="end-date">Completion Date:</label>
                            <input type="date" id="end-date" required>
                            <label for="rate">Rate Type:</label>
                            <select id="rate" required>
                                <option value="" selected disabled>-- Select --</option>
                                <option value="hourly">Hourly Rate</option>
                                <option value="set">Set Rate</option>
                            </select>
                            <label for="amount">Amount:</label>
                            <input type="number" id="amount" required>
                        </div>
                        <button id="generate-pdf-btn">Generate PDF</button>
                        <button id="cancel-export-btn">Cancel</button>
                    </div>
                    <button id="export-btn">Export</button>
                </section>
                <!-- Account -->
                <section id="account-view" class="hidden">
                    <h2>Account</h2>
                    <h3 style="text-align: center;">Current email: <strong id="account-email"></strong></h3>
                    <input type="email" id="new-email" placeholder="New email" autocomplete="email">
                    <input type="password" id="current-password" placeholder="Current password" autocomplete="current-password">
                    <p id="account-msg" style="text-align: center;"></p>
                    <button id="update-email-btn">Update Email</button>
                    <button id="logout-btn">Log Out</button>
                </section>
                <!-- Navigation -->
                <button id="back-btn">Back to Timer</button>
            </main>
        </div>
        <!-- Developer file -->
        <script type="module" src="config.local.js"></script>
        <!-- public file -->
        <script type="module" src="app.js"></script>
    </body>
</html>
